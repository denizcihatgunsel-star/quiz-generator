[build]
  # Skip all non-production Netlify builds (deploy previews / branch deploys). Prod runs on Vercel.
  ignore = "if [ \"$CONTEXT\" = \"production\" ]; then exit 1; else exit 0; fi"
  command = "npm run build"
  publish = ".next"

[functions]
  external_node_modules = ["@prisma/adapter-libsql", "@libsql/client"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect non-www to www
[[redirects]]
  from = "https://examina.ink/*"
  to = "https://www.examina.ink/:splat"
  status = 301
  force = true
