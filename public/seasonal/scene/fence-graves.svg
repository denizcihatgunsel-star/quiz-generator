<svg viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <g fill="#1A0E1C">
    <!-- Iron fence repeating pattern -->
    <g id="fencePost">
      <rect x="0" y="90" width="3" height="50"/>
      <circle cx="1.5" cy="88" r="3"/>
    </g>
    <use href="#fencePost" x="0"/>
    <use href="#fencePost" x="40"/>
    <use href="#fencePost" x="80"/>
    <use href="#fencePost" x="120"/>
    <use href="#fencePost" x="160"/>
    <use href="#fencePost" x="200"/>
    <use href="#fencePost" x="240"/>
    <use href="#fencePost" x="280"/>
    <use href="#fencePost" x="320"/>
    <use href="#fencePost" x="360"/>
    <use href="#fencePost" x="400"/>
    <use href="#fencePost" x="440"/>
    <use href="#fencePost" x="480"/>
    <use href="#fencePost" x="520"/>
    <use href="#fencePost" x="560"/>
    <use href="#fencePost" x="600"/>
    <use href="#fencePost" x="640"/>
    <use href="#fencePost" x="680"/>
    <use href="#fencePost" x="720"/>
    <use href="#fencePost" x="760"/>
    <use href="#fencePost" x="800"/>
    <use href="#fencePost" x="840"/>
    <use href="#fencePost" x="880"/>
    <use href="#fencePost" x="920"/>
    <use href="#fencePost" x="960"/>
    <use href="#fencePost" x="1000"/>
    <use href="#fencePost" x="1040"/>
    <use href="#fencePost" x="1080"/>
    <use href="#fencePost" x="1120"/>
    <use href="#fencePost" x="1160"/>
    
    <!-- Horizontal fence rails -->
    <rect x="0" y="100" width="1200" height="2"/>
    <rect x="0" y="115" width="1200" height="2"/>
    
    <!-- Max 3 gravestones, none in centre 30-70% -->
    <!-- Gravestone 1 (left) -->
    <path d="M 200,60 Q 200,50 210,50 L 230,50 Q 240,50 240,60 L 240,130 L 200,130 Z"/>
    
    <!-- Gravestone 2 (tilted, left-centre) -->
    <g transform="rotate(-6 280 95)">
      <rect x="260" y="70" width="35" height="60" rx="3"/>
      <path d="M 260,70 Q 277,55 295,70"/>
    </g>
    
    <!-- Gravestone 3 (right) -->
    <rect x="950" y="75" width="30" height="55" rx="2"/>
    <circle cx="965" cy="75" r="15"/>
  </g>
</svg>
